name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find zlib.h and libpng inside the image
        run: |
          docker run --rm devkitpro/devkitppc:20200704 \
            bash -c "find / -iname 'zlib.h' 2>/dev/null; echo '---'; find / -iname 'png.h' 2>/dev/null"
