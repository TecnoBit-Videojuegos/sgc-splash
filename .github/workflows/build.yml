name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build sgc-splash inside devkitPPC container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/brosexecconf devkitpro/devkitppc:20200704 \
            bash -c "sed -i 's|^TARGET.*|TARGET := IPL|' Makefile && sed -i 's|^LIBDIRS.*|LIBDIRS := \$(CURDIR) \$(PORTLIBS)|' Makefile && make clean && make"

      - name: Upload compiled dol
        uses: actions/upload-artifact@v4
        with:
          name: sgc-splash-animado
          path: brosexecconf/IPL.dol
          if-no-files-found: error
