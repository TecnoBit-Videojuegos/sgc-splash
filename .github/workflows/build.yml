name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build brosexecconf inside old devkitPPC container
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace/brosexecconf devkitpro/devkitppc:20200704 \
            bash -c "cp Makefile.back Makefile && make clean && make"

      - name: Upload compiled dol
        uses: actions/upload-artifact@v4
        with:
          name: brosexecconf-back-animado
          path: brosexecconf/brosexecconf-back.dol
          if-no-files-found: error
